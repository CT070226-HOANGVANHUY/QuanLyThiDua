{% extends "base.html" %}
{% block title %}Quy chế{% endblock %}
{% block body %}
<h1 class="page-title">Quy chế</h1>
<form class="toolbar" method="get">
  <input name="q" value="{{ q }}" placeholder="Tìm..." style="padding:8px 12px;border:1px solid var(--line);border-radius:10px;min-width:240px">
  <button class="btn" type="submit">Tìm</button>
  <button class="btn-gold" type="button" onclick="openQc()">+ Thêm</button>
</form>
<div class="card">
<table class="data">
  <thead><tr><th>STT</th><th>Mục</th><th>Nội dung</th><th>Điểm</th><th>Ghi chú</th><th></th></tr></thead>
  <tbody>
  {% for r in rows %}
  <tr>
    <td>{{ r.stt }}</td>
    <td>{{ r.muc }}</td>
    <td>{{ r.noi_dung }}</td>
    <td><b>{{ r.diem }}</b></td>
    <td>{{ r.ghi_chu }}</td>
    <td>
      <button class="btn ghost sm" type="button" onclick='openQc({{ r|tojson }})'>Sửa</button>
      <form method="post" action="{{ url_for('xoa_quyche', id=r.id) }}" style="display:inline" onsubmit="return confirm('Xóa mục này?')">
        <input type="hidden" name="nam_id" value="{{ nam.id }}">
        <button class="btn danger sm" type="submit">Xóa</button>
      </form>
    </td>
  </tr>
  {% endfor %}
  </tbody>
</table>
</div>

<div class="modal-bg" id="qcModal">
  <form class="modal" method="post" action="{{ url_for('luu_quyche') }}">
    <input type="hidden" name="nam_id" value="{{ nam.id }}">
    <h3 id="qcTitle">Thêm quy chế</h3>
    <input type="hidden" name="id" id="qcId">
    <div class="form-grid">
      <div class="field"><label>STT</label><input name="stt" id="qcStt"></div>
      <div class="field"><label>Mục</label><input name="muc" id="qcMuc" required></div>
      <div class="field" style="grid-column:1/-1"><label>Nội dung</label><textarea name="noi_dung" id="qcNd" rows="3" required></textarea></div>
      <div class="field"><label>Điểm</label><input name="diem" id="qcDiem" required placeholder="−5/HS"></div>
      <div class="field"><label>Ghi chú</label><input name="ghi_chu" id="qcGc"></div>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
      <button type="button" class="btn ghost" onclick="document.getElementById('qcModal').classList.remove('show')">Hủy</button>
      <button class="btn" type="submit">Lưu</button>
    </div>
  </form>
</div>
{% endblock %}
{% block extra %}
<script>
function openQc(r){
  document.getElementById('qcModal').classList.add('show');
  document.getElementById('qcTitle').textContent = r ? 'Sửa quy chế' : 'Thêm quy chế';
  document.getElementById('qcId').value = r ? r.id : '';
  document.getElementById('qcStt').value = r ? (r.stt||'') : '';
  document.getElementById('qcMuc').value = r ? (r.muc||'') : '';
  document.getElementById('qcNd').value = r ? (r.noi_dung||'') : '';
  document.getElementById('qcDiem').value = r ? (r.diem||'') : '';
  document.getElementById('qcGc').value = r ? (r.ghi_chu||'') : '';
}
</script>
{% endblock %}
