{% extends "base.html" %}
{% block title %}Công thức{% endblock %}
{% block body %}
<h1 class="page-title">Công thức</h1>

{% if nam and year_formula %}
<div class="card">
  <h3>Điểm miệng chia cho</h3>
  <form method="post" action="/cong-thuc">
    <input type="hidden" name="nam_id" value="{{ nam.id }}">
    <div class="field">
      <label><input type="radio" name="ktm_divisor" value="count" {% if year_formula.ktm_divisor!='si_so' %}checked{% endif %}> Số lần có điểm miệng</label>
    </div>
    <div class="field" style="margin-top:8px">
      <label><input type="radio" name="ktm_divisor" value="si_so" {% if year_formula.ktm_divisor=='si_so' %}checked{% endif %}> Sĩ số lớp</label>
    </div>

    <h3 style="margin-top:20px">Hội học</h3>
    <div class="field" style="margin-top:8px">
      <label><input type="radio" name="hoi_hoc_double" value="none" {% if year_formula.hoi_hoc_double=='none' %}checked{% endif %}> Cộng bốn hạng tuần</label>
    </div>
    <div class="field" style="margin-top:8px">
      <label><input type="radio" name="hoi_hoc_double" value="hdtt" {% if year_formula.hoi_hoc_double=='hdtt' %}checked{% endif %}> Cộng bốn hạng tuần + văn nghệ / thể thao</label>
    </div>
    <div class="field" style="margin-top:8px">
      <label><input type="radio" name="hoi_hoc_double" value="hdtt_only" {% if year_formula.hoi_hoc_double=='hdtt_only' %}checked{% endif %}> Cộng bốn hạng tuần + văn nghệ / thể thao ×2</label>
    </div>
    <div class="field" style="margin-top:8px">
      <label><input type="radio" name="hoi_hoc_double" value="week_xt" {% if year_formula.hoi_hoc_double=='week_xt' %}checked{% endif %}> Nhân đôi hạng tuần</label>
    </div>
    <h3 style="margin-top:20px">Học kỳ</h3>
    <div class="field" style="margin-top:8px">
      <label><input type="radio" name="hk_basis" value="dots" {% if year_formula.hk_basis=='dots' %}checked{% endif %}> Tổng xếp thứ theo đợt 8 tuần × 2 + HĐTT</label>
    </div>
    <div class="field" style="margin-top:8px">
      <label><input type="radio" name="hk_basis" value="months" {% if year_formula.hk_basis!='dots' %}checked{% endif %}> Tổng xếp thứ theo tháng × 2 + HĐTT</label>
    </div>
    <p style="margin:16px 0 0"><button type="submit" class="btn">Lưu</button></p>
  </form>
</div>
{% endif %}
{% endblock %}
